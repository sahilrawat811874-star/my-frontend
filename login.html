<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — NextGen Innovators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="bg-fx" aria-hidden="true"></div>

<main class="login-wrap">
  <div class="login-card" id="loginCard">
    <div class="login-logo" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <h1>Admin Login</h1>
    <p class="login-sub">Access the 3D Property Mapping Dashboard</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="admin">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-row">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="togglePassword" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
      </div>

      <p class="form-error" id="formError" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>

      <p class="demo-hint">Demo access — Username: <code>admin</code> &nbsp;Password: <code>admin123</code></p>
    </form>

    <a href="index.html" class="back-home">Back to home</a>
  </div>
</main>

<script src="login.js"></script>
</body>
</html>
